# 保有株式の設定ファイル
# 
# 銘柄の追加方法:
#   - code: 銘柄コード（日本株は末尾に.Tを付ける）
#   - name: 銘柄名（表示用）
#   - purchase_price: 購入価格（円）
#   - quantity: 保有株数
#
# 移動平均線の設定:
#   - short_period: 短期移動平均の日数（デフォルト: 5日）
#   - long_period: 長期移動平均の日数（デフォルト: 25日）

settings:
  short_period: 5
  long_period: 25

stocks:
  - code: "7203.T"
    name: "トヨタ自動車"
    purchase_price: 2500
    quantity: 100

  - code: "9984.T"
    name: "ソフトバンクグループ"
    purchase_price: 6000
    quantity: 50

  - code: "6758.T"
    name: "ソニーグループ"
    purchase_price: 12000
    quantity: 30

# 銘柄を追加する場合は以下のフォーマットで追加してください:
#  - code: "XXXX.T"
#    name: "銘柄名"
#    purchase_price: 0000
#    quantity: 00
